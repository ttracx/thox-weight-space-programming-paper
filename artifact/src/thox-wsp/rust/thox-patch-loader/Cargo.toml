[package]
name = "thox-patch-loader"
version = "0.1.0"
edition = "2021"
description = "THOX WSP patch loader: verify a signed, base-hash-pinned rank-1 weight patch, apply it, verify result hashes, A/B atomic switch with rollback."
license = "Apache-2.0"

[dependencies]
sha2 = "0.10"
ed25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
